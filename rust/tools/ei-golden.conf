# EI official CLI config used to generate golden baseline JSON for the Rust
# rewrite. Feed via: GuildWars2EliteInsights-CLI.exe -c <this file> <log.zevtc>
# Keys map 1:1 to GW2EIParserCommons/Settings/Settings.cs properties; see
# GW2EIParserCommons/Settings/sample.conf for the full list.
# NOTE: key=value pairs must not contain spaces; no blank lines (each blank
# line triggers an "invalid setting line" warning); OutLocation must already
# exist. SaveAtOut defaults to true and writes next to the input log
# unconditionally (ProgramHelper.cs:567) - it MUST be set to false for
# OutLocation to take effect. ASCII-only path as extra safety.
SaveAtOut=false
SaveOutHTML=false
SaveOutTrace=false
SaveOutJSON=true
# dps.report-like full output (official GUI defaults to false; keep true so
# CombatReplayMetaData blocks are present in the baseline).
ParseCombatReplay=true
OutLocation=D:\ei-golden
